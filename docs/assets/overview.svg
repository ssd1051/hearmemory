<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="430" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Column titles -->
  <text x="130" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a" letter-spacing="1">AGENTS</text>
  <text x="480" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a" letter-spacing="1">HEARMEMORY (PER PROJECT)</text>
  <text x="832" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a" letter-spacing="1">JUDGE</text>

  <!-- Agents -->
  <g>
    <rect x="30" y="58" width="200" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="130" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Claude Code</text>
    <rect x="48" y="98" width="78" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="87" y="115" text-anchor="middle" font-size="12" fill="#57606a">subagent A</text>
    <rect x="134" y="98" width="78" height="26" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="173" y="115" text-anchor="middle" font-size="12" fill="#57606a">subagent B</text>
    <text x="130" y="148" text-anchor="middle" font-size="12" fill="#57606a">parallel, same project</text>

    <rect x="30" y="178" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="130" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Codex</text>
    <text x="130" y="222" text-anchor="middle" font-size="12" fill="#57606a">earlier or later session</text>

    <rect x="30" y="250" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="130" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Cursor</text>
    <text x="130" y="294" text-anchor="middle" font-size="12" fill="#57606a">experimental</text>

    <rect x="30" y="322" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="130" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">git commit</text>
    <text x="130" y="366" text-anchor="middle" font-size="12" fill="#57606a">any agent or human</text>
  </g>

  <!-- Capture -->
  <rect x="300" y="58" width="360" height="92" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="480" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da">1  Capture</text>
  <text x="480" y="106" text-anchor="middle" font-size="12.5" fill="#1f2328">hooks · MCP tools · Codex session import</text>
  <text x="480" y="126" text-anchor="middle" font-size="12.5" fill="#1f2328">commands, test runs, file edits, commits, claims</text>
  <text x="480" y="142" text-anchor="middle" font-size="11.5" fill="#57606a">redacted before storage</text>

  <!-- Store -->
  <rect x="300" y="170" width="360" height="92" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="480" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">2  Shared memory  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400">.hearmemory/</tspan></text>
  <text x="480" y="218" text-anchor="middle" font-size="12.5" fill="#1f2328">append-only observations with provenance</text>
  <text x="480" y="238" text-anchor="middle" font-size="12.5" fill="#1f2328">(agent · session · subagent · commit)</text>
  <text x="480" y="254" text-anchor="middle" font-size="11.5" fill="#57606a">claims, judgments, issues</text>

  <!-- Deliver -->
  <rect x="300" y="282" width="360" height="96" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="480" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#1a7f37">3  Deliver</text>
  <text x="480" y="330" text-anchor="middle" font-size="12.5" fill="#1f2328">brief at every session and subagent start</text>
  <text x="480" y="350" text-anchor="middle" font-size="12.5" fill="#1f2328">recall on demand · pre-commit check</text>
  <text x="480" y="368" text-anchor="middle" font-size="11.5" fill="#57606a">[SUPPORTED]  [DISPUTED]  [REFUTED]  [ADDRESSED?] …</text>

  <!-- Judge -->
  <rect x="730" y="118" width="204" height="204" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <text x="832" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#8250df">Jev</text>
  <text x="832" y="165" text-anchor="middle" font-size="11.5" fill="#57606a">background worker</text>
  <text x="746" y="194" font-size="12.5" fill="#1f2328">• same code object?</text>
  <text x="746" y="216" font-size="12.5" fill="#1f2328">• same event?</text>
  <text x="746" y="238" font-size="12.5" fill="#1f2328">• restates a claim?</text>
  <text x="746" y="260" font-size="12.5" fill="#1f2328">• evidence supports /</text>
  <text x="758" y="278" font-size="12.5" fill="#1f2328">refutes the claim?</text>
  <text x="832" y="306" text-anchor="middle" font-size="11.5" fill="#57606a">~0.5 s per call · rules w/o key</text>

  <!-- Arrows: agents -> capture -->
  <path d="M230 110 L298 100" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 206 C265 190, 270 140, 298 122" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M230 278 C272 262, 276 150, 298 134" stroke="#57606a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- capture -> store -->
  <path d="M480 150 L480 168" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- store -> deliver -->
  <path d="M480 262 L480 280" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- store <-> judge -->
  <path d="M660 200 L728 200" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#arrowJ)"/>
  <text x="694" y="192" text-anchor="middle" font-size="11" fill="#8250df">candidates</text>
  <path d="M728 236 L662 236" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#arrowJ)"/>
  <text x="694" y="252" text-anchor="middle" font-size="11" fill="#8250df">judgments</text>

  <!-- deliver -> agents -->
  <path d="M300 350 C262 350, 250 350, 232 350" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrowG)"/>
  <path d="M300 318 C268 300, 262 160, 232 146" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrowG)"/>
  <path d="M300 330 C270 318, 262 230, 232 222" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#arrowG)"/>

  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#57606a">What one agent finds, runs, or claims becomes checked, shared knowledge for every other agent on the project.</text>
</svg>
